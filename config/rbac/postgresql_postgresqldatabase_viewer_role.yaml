# This rule is not used by the project shippercd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to postgresql.shippercd.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shippercd
    app.kubernetes.io/managed-by: kustomize
  name: postgresql-postgresqldatabase-viewer-role
rules:
- apiGroups:
  - postgresql.shippercd.io
  resources:
  - postgresqldatabases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.shippercd.io
  resources:
  - postgresqldatabases/status
  verbs:
  - get
