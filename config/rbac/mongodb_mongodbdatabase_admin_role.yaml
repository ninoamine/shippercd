# This rule is not used by the project shippercd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over mongodb.shippercd.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shippercd
    app.kubernetes.io/managed-by: kustomize
  name: mongodb-mongodbdatabase-admin-role
rules:
- apiGroups:
  - mongodb.shippercd.io
  resources:
  - mongodbdatabases
  verbs:
  - '*'
- apiGroups:
  - mongodb.shippercd.io
  resources:
  - mongodbdatabases/status
  verbs:
  - get
