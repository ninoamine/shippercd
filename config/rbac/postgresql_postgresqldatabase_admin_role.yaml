# This rule is not used by the project shippercd itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over postgresql.shippercd.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shippercd
    app.kubernetes.io/managed-by: kustomize
  name: postgresql-postgresqldatabase-admin-role
rules:
- apiGroups:
  - postgresql.shippercd.io
  resources:
  - postgresqldatabases
  verbs:
  - '*'
- apiGroups:
  - postgresql.shippercd.io
  resources:
  - postgresqldatabases/status
  verbs:
  - get
